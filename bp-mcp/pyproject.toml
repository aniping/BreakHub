[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-mcp"
version = "0.1.0"
description = "BreakHub stdio MCP gateway"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==3.2.4",
    "pydantic==2.13.4",
    "requests==2.33.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pyinstaller==6.21.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
breakhub-mcp = "bp_mcp.frozen_stdio_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bp_mcp"]

[[tool.mypy.overrides]]
module = ["requests"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
